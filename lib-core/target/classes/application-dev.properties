## ================================================================================================================================
## spring mail setup
## ================================================================================================================================
# 邮件默认编码
spring.mail.default-encoding=UTF-8
# 邮件服务器地址
spring.mail.host=${MAIL_HOST:smtp.qq.com}
# 邮件服务器地址
spring.mail.port=${MAIL_HOST:587}
# 邮件发送账户
spring.mail.username=${MAIL_USERNAME:2511804808@qq.com}
# 邮件发送授权码
spring.mail.password=${MAIL_PASSWORD:vkrjqotfztcieaea}
# 邮件使用协议
spring.mail.protocol=${MAIL_PASSWORD:smtp}
# 连接超时时间（毫秒）
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTIONTIMEOUT:5000}
# 超时时间（毫秒）
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:3000}
# 写入超时时间（毫秒）
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITETIMEOUT:5000}
# 是否需要认证
spring.mail.properties.mail.smtp.auth=true
# 是否启用STARTTLS
spring.mail.properties.mail.smtp.starttls.enable=true
# 是否强制要求STARTTLS
spring.mail.properties.mail.smtp.starttls.required=true
## ================================================================================================================================
## redis setup
## ================================================================================================================================
# Redis 服务器地址
spring.data.redis.host=${REDIS_HOST:localhost}
# Redis 端口
spring.data.redis.port=${REDIS_PORT:6379}
# Redis 数据库索引（默认 0）
spring.data.redis.database=${REDIS_DATABASE:0}
# Redis 连接密码（如果需要）
spring.data.redis.password=${REDIS_PASSWORD:}
# Redis 连接超时时间（毫秒）
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}
# Redis 客户端类型
spring.data.redis.client-type=lettuce
# Redis 连接池最大连接数
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
# Redis 连接池最大空闲连接数
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
# Redis 连接池最小空闲连接数
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
# Redis 连接池最大等待时间（毫秒，-1 表示无限制）
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1}
# 是否启用 SSL 连接
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
## ================================================================================================================================
## mongodb setup
## ================================================================================================================================
spring.data.mongodb.uri=mongodb://localhost/test

